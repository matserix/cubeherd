# Cubeherd selbst als Container.
# Wichtig: Das Datenverzeichnis muss im Container unter DEMSELBEN Pfad liegen wie auf dem Host,
# weil Docker die Bind-Mounts der Minecraft-Server auf dem Host auflöst.
services:
  cubeherd:
    build: ..
    image: cubeherd:latest
    container_name: cubeherd
    restart: unless-stopped
    ports:
      - "8420:8420"          # nur im LAN/VPN freigeben
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/cubeherd:/srv/cubeherd
    environment:
      CUBEHERD_DATA: /srv/cubeherd
      TZ: Europe/Berlin       # für Backup-Zeitpläne
    mem_limit: 96m
